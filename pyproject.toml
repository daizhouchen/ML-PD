[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpd-research"
version = "0.2.0"
description = "Reproducible, leakage-aware metabolomics classification experiments"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<1.8",
  "matplotlib>=3.9,<4", "xgboost>=2.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2"]
notebook = ["jupyterlab>=4,<5"]

[project.scripts]
mlpd = "mlpd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
